<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Numogarden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Major+Mono+Display&display=swap">
<style>
/* Layout: a one-screen toy. The board fills the screen; a small readout floats at the top, the tray of tiles and tools sits at the bottom,
   and sheets slide up for gifts, lore and the chronicle. One deliberate look: a pastel world that dusks as it gets weirder. */
:root {
  --ground: #D9E5DE;
  --panel: #F6FAF7;
  --well: #E7EFEA;
  --ink: #1E2B2F;
  --muted: #586A6C;
  --rule: #B7C9C1;
  --tc: #9A7A00;      /* Numogram region colours, as in Numogram Lab */
  --warp: #6E4FD0;
  --plex: #C23B5A;
  --fit: #1F9C84;
  --display: "Major Mono Display", "IBM Plex Mono", ui-monospace, monospace;
  --ui: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.35;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--plex); outline-offset: 2px; }

.hud {
  position: absolute; top: 8px; left: 0; right: 0; z-index: 3;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.brand {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 7px 11px 8px;
  display: grid; gap: 5px; box-shadow: 0 2px 0 rgba(30, 43, 47, .07); min-width: 0;
}
.wordmark { font-family: var(--display); font-size: 15px; line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.stats { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats b { font-weight: 500; color: var(--ink); }
.meter { width: 58px; height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--tc), var(--plex)); transition: width .35s ease; }
.pips { display: inline-flex; gap: 3px; }
.pips span { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--plex); box-sizing: border-box; }
.pips span.on { background: var(--plex); }
.hud-right { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.icon {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 2px 0 rgba(30, 43, 47, .07);
}
.icon svg { width: 20px; height: 20px; }
.gift-chip {
  height: 40px; border-radius: 12px; border: 1px solid var(--plex); background: var(--plex); color: #FFF5F7;
  padding: 0 12px; font-weight: 600; cursor: pointer; animation: nudge 1.6s ease-in-out infinite;
}
@keyframes nudge { 50% { transform: translateY(-2px); } }

.toasts {
  position: absolute; top: 76px; left: 0; right: 0; z-index: 4; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; justify-items: center; gap: 6px;
}
.toast {
  max-width: 400px; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--tc);
  border-radius: 12px; padding: 6px 11px; font-size: 13.5px; line-height: 1.28; box-shadow: 0 4px 14px rgba(30, 43, 47, .14);
  animation: pop .28s ease-out; transition: opacity .4s, transform .4s;
}
.toast.out { opacity: 0; transform: translateY(-6px); }
.toast.lemur, .toast.rumor, .toast.faded, .toast.dc, .toast.absorb, .toast.dream { border-left-color: var(--warp); }
.toast.level, .toast.reward, .toast.metro, .toast.spawn { border-left-color: var(--plex); }
.toast.lost, .toast.hungry, .toast.jungle { border-left-color: #3B8558; }
.toast.sea { border-left-color: #3E9CC0; }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

.tray {
  position: absolute; left: 0; right: 0; bottom: 8px; z-index: 3; pointer-events: none;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  display: grid; gap: 7px; justify-items: center;
}
.hint {
  max-width: min(100%, 460px); background: rgba(246, 250, 247, .94); border: 1px solid var(--rule); border-radius: 999px;
  padding: 5px 13px; font-size: 14px; line-height: 1.25; text-align: center; pointer-events: auto; text-wrap: balance;
}
.dock {
  width: 100%; max-width: 560px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-radius: 18px;
  padding: 8px; display: grid; gap: 8px; pointer-events: auto; box-shadow: 0 -1px 0 rgba(30, 43, 47, .04), 0 6px 18px rgba(30, 43, 47, .10);
}
.slots { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.slots::-webkit-scrollbar { display: none; }
.slot {
  flex: none; width: 62px; height: 70px; border-radius: 14px; border: 2px solid transparent; background: var(--well);
  display: grid; justify-items: center; align-content: center; padding: 0; cursor: pointer; transition: transform .15s;
}
.slot canvas { width: 50px; height: 50px; display: block; }
.slot small { font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.1; margin-top: 1px; }
.slot[aria-pressed="true"] { border-color: var(--ink); background: #FFFFFF; transform: translateY(-2px); }
.slot.gift { background: #F6E7EC; }
.slot.gift.r { background: #ECE7F8; }
.sep { flex: none; width: 1px; background: var(--rule); margin: 6px 1px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  flex: 1 1 0; min-width: 62px; min-height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--well);
  font-weight: 600; font-size: 14px; padding: 4px 6px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.btn.primary { flex: 1.7 1 0; background: var(--ink); border-color: var(--ink); color: #F6FAF7; }
.btn.on { border-color: var(--plex); background: #FBE9EE; }
.btn:disabled { opacity: .38; cursor: default; }
.btn .n { font-family: var(--mono); font-size: 11px; background: rgba(30, 43, 47, .1); border-radius: 6px; padding: 1px 5px; }
.btn.primary .n { background: rgba(255, 255, 255, .18); }

.scrim { position: absolute; inset: 0; z-index: 6; background: rgba(30, 43, 47, .32); display: grid; align-items: end; justify-items: center; }
.sheet {
  width: 100%; max-width: 560px; box-sizing: border-box; background: var(--panel); border-radius: 22px 22px 0 0;
  padding-block: 18px 20px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  max-height: 82%; overflow-y: auto; display: grid; gap: 12px; animation: rise .25s ease-out; -webkit-user-select: text; user-select: text;
}
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }
.sheet h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 700; text-wrap: balance; }
.sheet h3 { margin: 6px 0 0; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; max-width: 62ch; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; max-width: 62ch; }
.sheet .readout { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet .note { font-size: 13px; color: var(--muted); }
.sheet a { color: var(--ink); text-underline-offset: 3px; }
.sheet-close { justify-self: stretch; }
.choices { display: grid; gap: 10px; }
.choice {
  display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
  border: 1.5px solid var(--rule); background: #FFFFFF; border-radius: 16px; padding: 10px 12px; cursor: pointer;
}
.choice:hover { border-color: var(--ink); }
.choice canvas { width: 58px; height: 58px; }
.choice b { display: block; font-size: 17px; }
.choice span { display: block; font-size: 14px; color: var(--muted); line-height: 1.3; }
.lname { font-family: var(--display); font-weight: 400 !important; font-size: 26px !important; letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--mono); font-size: 12px; border-radius: 8px; padding: 2px 7px; border: 1px solid var(--rule); background: #FFFFFF; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.chron { display: grid; gap: 4px; font-size: 14px; max-height: 220px; overflow-y: auto; }
.chron div { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 6px; }
.chron i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.credit { font-family: var(--mono); font-size: 12px; color: var(--muted); }
/* a setting is one tappable row: words on the left, a switch on the right */
.setting { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; border: 1.5px solid var(--rule); background: #FFFFFF; border-radius: 16px; padding: 10px 12px; cursor: pointer; }
.setting b { display: block; font-size: 15px; font-weight: 600; }
.setting .note { display: block; line-height: 1.3; }
.switch { flex: none; position: relative; width: 50px; height: 30px; box-sizing: border-box; border-radius: 999px; border: 1px solid var(--rule); background: var(--well); transition: background .2s, border-color .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30, 43, 47, .25); transition: transform .2s; }
.setting[aria-checked="true"] .switch { background: var(--fit); border-color: var(--fit); }
.setting[aria-checked="true"] .switch::after { transform: translateX(20px); }
@media (prefers-reduced-motion: reduce) { .gift-chip, .toast, .sheet { animation: none; } .slot, .switch, .switch::after { transition: none; } }
</style>

<div id="app">
  <canvas id="board" aria-label="The board. Tap a spot to try the selected tile there; drag to move, pinch to zoom."></canvas>

  <div class="hud" id="hud">
    <div class="brand">
      <div class="wordmark">numogarden</div>
      <div class="stats">
        <span>★ <b id="stars">0</b></span>
        <span class="meter" title="Gift meter"><i id="meter"></i></span>
        <span class="pips" id="pips" title="Weirdness"><span></span><span></span><span></span><span></span></span>
      </div>
    </div>
    <div class="hud-right">
      <button type="button" class="gift-chip" id="giftChip" hidden>Gift ready</button>
      <button type="button" class="icon" id="centerBtn" aria-label="Center the map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
      <button type="button" class="icon" id="infoBtn" aria-label="How it works, chronicle and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6"/><path d="M12 17.2v.1"/></svg>
      </button>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="tray" id="tray">
    <div class="hint" id="hint">Tap a glowing spot to try the tile there.</div>
    <div class="dock">
      <div class="slots" id="slots"></div>
      <div class="tools">
        <button type="button" class="btn" id="undoBtn" aria-label="Undo the last move">Undo</button>
        <button type="button" class="btn" id="rotBtn" aria-label="Turn the tile">Turn</button>
        <button type="button" class="btn primary" id="placeBtn">Place</button>
        <button type="button" class="btn" id="buildBtn" hidden aria-label="Builder: clear a tile">Build <span class="n" id="buildN">0</span></button>
        <button type="button" class="btn" id="ferryBtn" hidden>Ferry <span class="n" id="ferryN">0</span></button>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
</div>

<script>/* Numogarden simulation core.
   Pure and deterministic given a seed: no DOM, no clock. Runs in Node (harness) and in the page.
   A tile is six wedges; wedge i faces edge i and touches wedge (i+3)%6 of the neighbour in DIRS[i].
   Time advances one step per placement. */
(function (root) {
'use strict';

const DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]]; // flat-top axial, edge i at 30+60i degrees
const BASE = ['H', 'F', 'J', 'S']; // Hamlet (compute), Field (corpus), Jungle (the Outside), Sea (Lemurian)
const LAND = ['H', 'F', 'J', 'S', 'D']; // terrains that form clusters; D (data centre) only arrives at night
const XW = ['X', 'X', 'X', 'X', 'X', 'X'];

const CFG = {
  WEIGHTS: { H: 0.26, F: 0.26, J: 0.28, S: 0.20 },
  NIGHT_WEIGHTS: { H: 0.26, D: 0.26, J: 0.28, S: 0.20 }, // at night the corpus is spent: data centres take the fields' place
  DC_AFTER_WAKE: true,  // ... but only once a town has built itself since nightfall
  COOL_K: 6,            // data-centre wedges one sea contact can cool
  DREAM_EVERY: 6,       // a cooled data centre lays a dream (a rumor tile) on an open edge this often
  CRIT: 24,             // hamlet wedges for a town to start building itself (critical mass)
  MATURE: 40,           // steps a place must have been a town before it can wake up
  FLUSH: 2,             // supply multiple at which a town wakes below critical mass (0 = off)
  STARVE_MIN: 4,        // hamlets smaller than this get by on their own
  FALLOW_J: 6,          // fields go fallow only beside a jungle at least this big
  SUPPLY_K: 3,          // hamlet wedges one field/sea contact can feed
  DECAY_T: 3,           // hungry steps before a wedge falls to meadow
  MEADOW_TO_JUNGLE: 0.35,
  JCRIT: 12,            // a jungle this big creeps into neglected land
  JUNGLE_INTO_DECAY: 0.3,
  SPRAWL_BASE: 0.35, SPRAWL_SLOPE: 0.02, SPRAWL_MAX: 0.85, TRY_EVERY: 20, // one more build try per TRY_EVERY wedges above CRIT
  CITY: 24,             // a hamlet cluster this big is a city, and cities reinforce themselves:
  CITY_BITE: 0.1,       //   a big jungle takes a decaying city wedge with this chance (full speed in a Sink area,
                        //   from a deep jungle, or when the city has under half the supply it needs),
  CITY_SLOPE: 0.04, CITY_TRY_EVERY: 10, // and building climbs with size twice as fast
  GROK_T: 60,           // a fed town that stays within one wedge of one size this long groks: it jumps a tier
  GROK_MIN: 18,         // and only a town this big, three quarters of the way to CRIT (smaller ones are mostly careless play)
  TRADE_BONUS: 0.15, HOME_BONUS: 0.10,
  METRO_EVERY: 10,
  CURRENT_FX: true,     // currents act on the land (false = measure where they would be, for the harness baseline)
  CURRENT_LINGER: 3,    // steps a current keeps flowing after its syzygy breaks
  SURGE_BONUS: 0.25,    // Surge: extra self-building chance,
  SURGE_MATURE: 0.5,    //   and towns wake after this share of MATURE
  WARP_TRIES: 2,        // Warp: building tries per step are multiplied by this
  PLEX_EVERY: 5, PLEX_CAP: 0.08, // Plex: one wedge turns wild every 5 steps while wild land is under 8%;
                                 // past the cap, Plex tiles from fits and gifts turn into stars too
  RUMOR_LIFE: 15, RUMOR_NEED: 3,
  HAND_MAX: 4, LEMUR_MAX: 10, METER_MAX: 15,
  TIERS: { H: [1, 6, 12, 24, 40], S: [1, 10, 20, 35], J: [1, 12, 30], F: [1, 10, 25], D: [1] },
  LEVELS: [0, 45, 130, 280, 520]
};

/* The Pandemonium Matrix demon names and zone pairs, as encoded in SVL's Numogram Lab (DEMON_TABLE).
   Index = mesh number a(a-1)/2 + b. */
const DEMONS = [[1,0,'Lurgo'],[2,0,'Duoddod'],[2,1,'Doogu'],[3,0,'Ixix'],[3,1,'Ixigool'],[3,2,'Ixidod'],[4,0,'Krako'],[4,1,'Sukugool'],[4,2,'Skoodu'],[4,3,'Skarkix'],[5,0,'Tokhatto'],[5,1,'Tukkamu'],[5,2,'Kuttadid'],[5,3,'Tikkitix'],[5,4,'Katak'],[6,0,'Tchu'],[6,1,'Djungo'],[6,2,'Djuddha'],[6,3,'Djynxx'],[6,4,'Tchakki'],[6,5,'Tchattuk'],[7,0,'Puppo'],[7,1,'Bubbamu'],[7,2,'Oddubb'],[7,3,'Pabbakis'],[7,4,'Ababbatok'],[7,5,'Papatakoo'],[7,6,'Bobobja'],[8,0,'Minommo'],[8,1,'Murrumur'],[8,2,'Nammamad'],[8,3,'Mummumix'],[8,4,'Numko'],[8,5,'Muntuk'],[8,6,'Mommoljo'],[8,7,'Mombbo'],[9,0,'Uttunul'],[9,1,'Tutagool'],[9,2,'Unnunddo'],[9,3,'Ununuttix'],[9,4,'Ununak'],[9,5,'Tukutu'],[9,6,'Unnutchi'],[9,7,'Nuttubab'],[9,8,'Ummnu']];
const CURRENTS = { 9: 'Plex', 7: 'Surge', 5: 'Hold', 3: 'Warp', 1: 'Sink' }; // keyed by syzygy difference
const TCSET = [1, 2, 4, 5, 7, 8];

function key(q, r) { return q + ',' + r; }
function dr(n) { n = Math.abs(Math.round(n)); return n === 0 ? 0 : 1 + (n - 1) % 9; }
/* AQ as in the Numogram Lab: A=10..Z=35, digits at face value */
function aqOf(s) {
  let t = 0;
  for (const ch of String(s).toLowerCase()) {
    if (ch >= 'a' && ch <= 'z') t += ch.charCodeAt(0) - 87;
    else if (ch >= '0' && ch <= '9') t += ch.charCodeAt(0) - 48;
  }
  return t;
}
function region(z) { return (z === 3 || z === 6) ? 'warp' : ((z === 9 || z === 0) ? 'plex' : 'tc'); }
function mesh(a, b) { if (a < b) { const t = a; a = b; b = t; } return a * (a - 1) / 2 + b; }
function demonClass(a, b) {
  const x = TCSET.includes(a), y = TCSET.includes(b);
  return x && y ? 'chrono' : (!x && !y ? 'xeno' : 'amphi');
}

/* mulberry32 kept in a plain object so the whole state serializes */
function rnd(st) {
  let a = st.s = (st.s + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(st, n) { return Math.floor(rnd(st) * n); }
function pickIdx(st, wts) {
  let s = 0; for (const w of wts) s += w;
  let x = rnd(st) * s;
  for (let i = 0; i < wts.length; i++) { x -= wts[i]; if (x < 0) return i; }
  return wts.length - 1;
}

function rot(w, k) { const o = new Array(6); for (let i = 0; i < 6; i++) o[(i + k) % 6] = w[i]; return o; }
function tileZone(t) { return t.kind === 'x' ? 0 : dr(aqOf(t.w.join(''))); }
function matches(a, b) {
  if (a === b || a === 'X' || b === 'X') return true;
  if (a === 'M') return b === 'F' || b === 'J';
  if (b === 'M') return a === 'F' || a === 'J';
  return false;
}

/* the deck: day weights until night (weirdness 4), then the night weights */
function deckOf(state) { return state.dcSince != null ? CFG.NIGHT_WEIGHTS : CFG.WEIGHTS; }
/* the fields are spent once it is night and a town has built itself since nightfall
   (a world that never woke, or went quiet, keeps its fields until a town builds again) */
function nightDeck(state, ev) {
  if (state.dcSince != null || state.level < 4) return;
  if (state.nightAt == null) state.nightAt = state.turn;
  if (CFG.DC_AFTER_WAKE && !(state.stats.lastSelfBuild >= state.nightAt)) return;
  state.dcSince = state.turn;
  pushEvent(state, ev, 'dc', 'The fields are spent. Data centres start to arrive.');
}
function genTile(st, W) {
  W = W || CFG.WEIGHTS;
  const types = Object.keys(W), wts = types.map(t => W[t]);
  const r = rnd(st);
  const k = r < 0.18 ? 1 : (r < 0.68 ? 2 : 3);
  let lens;
  if (k === 1) lens = [6];
  else if (k === 2) { const a = 1 + rint(st, 5); lens = [a, 6 - a]; }
  else {
    const c1 = 1 + rint(st, 5); let c2 = 1 + rint(st, 5); let g = 0;
    while (c2 === c1 && g++ < 20) c2 = 1 + rint(st, 5);
    if (c2 === c1) c2 = c1 === 5 ? 1 : c1 + 1;
    const a = Math.min(c1, c2), b = Math.max(c1, c2);
    lens = [a, b - a, 6 - b];
  }
  const segs = [];
  for (let s = 0; s < k; s++) {
    let t, g = 0;
    do { t = types[pickIdx(st, wts)]; } while (segs.includes(t) && g++ < 40);
    if (segs.includes(t)) t = types.find(x => !segs.includes(x));
    segs.push(t);
  }
  const w = new Array(6); let pos = rint(st, 6);
  for (let s = 0; s < k; s++) for (let n = 0; n < lens[s]; n++) { w[pos % 6] = segs[s]; pos++; }
  return w;
}

const NAME_A = ['Mum', 'Pud', 'Bram', 'Lem', 'Tok', 'Nib', 'Wib', 'Kit', 'Dod', 'Ux', 'Plex', 'Mur', 'Tik', 'Odd', 'Bub', 'Skoo', 'Jyn', 'Kat', 'Ixi', 'Num', 'Pip', 'Hum', 'Gib', 'Tut'];
const NAME_B = ['', '', '', 'ble', 'ka', 'ri', 'lo', 'dub', 'mu', 'ti', 'x', 'pa', 'nu'];
const NAME_C = ['wick', 'ton', 'by', 'ham', 'mere', 'ford', 'stead', 'burrow', 'hollow', 'nul', 'dod', 'mix', 'gool', 'tak', 'well', 'cot'];
function genName(st) {
  const s = NAME_A[rint(st, NAME_A.length)] + NAME_B[rint(st, NAME_B.length)] + NAME_C[rint(st, NAME_C.length)];
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}

function newGame(seed) {
  const state = {
    v: 1, seed: seed >>> 0, rng: { s: (seed >>> 0) || 1 }, turn: 0, stars: 0, meter: 0, streak: 0, level: 0,
    map: {}, nextId: 1, nextTag: 1, offers: [], hand: [], choices: 0,
    pending: [], spawns: [], builders: 0, ferries: 0, currents: [],
    groups: {}, lemurs: [], events: [],
    stats: { sprawl: 0, spawn: 0, reclaim: 0, decline: 0, firstSelfBuild: null, selfBuildAfter50: 0, reclaimAfter50: 0,
             perfect: 0, snug: 0, rumorsReal: 0, rumorsFaded: 0, syzygies: 0, lemurs: 0, wild: 0, groks: 0 }
  };
  addTile(state, 0, 0, ['H', 'H', 'F', 'F', 'S', 'J'], 'n');
  for (let i = 0; i < 3; i++) state.offers.push(genTile(state.rng));
  return state;
}

function addTile(state, q, r, w, kind, extra) {
  const t = { id: state.nextId++, q, r, w: w.slice(), d: [0, 0, 0, 0, 0, 0], tg: [0, 0, 0, 0, 0, 0], kind, born: state.turn };
  if (extra) Object.assign(t, extra);
  t.z = tileZone(t);
  state.map[key(q, r)] = t;
  return t;
}

function evalPlacement(state, w, q, r) {
  let m = 0, n = 0; const edges = [];
  for (let i = 0; i < 6; i++) {
    const nb = state.map[key(q + DIRS[i][0], r + DIRS[i][1])];
    if (!nb) { edges.push(0); continue; }
    n++;
    const ok = matches(w[i], nb.w[(i + 3) % 6]);
    if (ok) m++;
    edges.push(ok ? 1 : -1);
  }
  return { m, n, edges };
}

function hasNeighbour(state, q, r) {
  for (const d of DIRS) if (state.map[key(q + d[0], r + d[1])]) return true;
  return false;
}

  for (const k in state.map) {

  for (const k in state.map) {
    const t = state.map[k];
    for (let dq = -range; dq <= range; dq++) for (let drr = -range; drr <= range; drr++) {
      if (hexDist(0, 0, dq, drr) > range) continue;
      const q = t.q + dq, r = t.r + drr, kk = key(q, r);
      if (!state.map[kk] && !seen[kk]) { seen[kk] = 1; out.push([q, r]); }
    }
  }
  return out;
}

function slotTiles(state) {
  const out = state.offers.map((w, i) => ({ from: 'offer', i, kind: 'n', w }));
  state.hand.forEach((h, i) => out.push({ from: 'hand', i, kind: h.kind, w: h.kind === 'x' ? XW : h.w }));
  return out;
}

function pushEvent(state, ev, kind, txt, extra) {
  const e = Object.assign({ turn: state.turn, kind, txt }, extra || {});
  ev.push(e);
  state.events.push(e);
  if (state.events.length > 80) state.events.splice(0, state.events.length - 80);
}

function spawnLemur(state, d, k, ev, why) {
  if (state.level < 1) return;
  const [a, b, name] = DEMONS[d];
  state.lemurs.push({ d, k, born: state.turn, s: rint(state.rng, 1e9) });
  if (state.lemurs.length > CFG.LEMUR_MAX) state.lemurs.shift();
  state.stats.lemurs++;
  const pair = a + '::' + b;
  const msg = why === 'syzygy' ? `${name} (${pair}) slips through a syzygy to look around.`
    : why === 'rumor' ? `${name} (${pair}) moved into the rumor that came true.`
    : why === 'jungle' ? `${name} (${pair}) has been living in the deep jungle all along.`
    : `${name} (${pair}) wanders in, curious.`;
  pushEvent(state, ev, 'lemur', msg, { d });
}

function grant(state, item, ev) {
  if (state.hand.length >= CFG.HAND_MAX) { state.stars += 5; pushEvent(state, ev, 'reward', 'Hand full, so the bonus turns into +5★.'); return; }
  // one cap for all wild land: past PLEX_CAP a Plex tile from a fit or a gift turns into stars
  if (item.kind === 'x' && shares(state).X >= CFG.PLEX_CAP) { state.stars += 5; pushEvent(state, ev, 'reward', 'Wild land is plentiful, so the bonus turns into +5★.'); return; }
  state.hand.push(item);
}
function choose(state, which) {
  if (state.choices <= 0) return false;
  state.choices--;
  const ev = [];
  grant(state, which === 'r' ? { kind: 'r', w: genTile(state.rng, deckOf(state)) } : { kind: 'x' }, ev);
  return ev;
}

function place(state, slotRef, q, r, k, opts) {
  opts = opts || {};
  const kk = key(q, r);
  if (state.map[kk]) return { ok: false, why: 'occupied' };
  if (opts.ferry) {
    if (state.ferries <= 0) return { ok: false, why: 'no ferry' };
    let near = false;
    for (const t of Object.values(state.map)) if (hexDist(t.q, t.r, q, r) <= 3) { near = true; break; }
    if (!near) return { ok: false, why: 'too far' };
  } else if (!hasNeighbour(state, q, r)) return { ok: false, why: 'not adjacent' };
  let kind, w;
  if (slotRef.from === 'offer') { w = state.offers[slotRef.i]; kind = 'n'; }
  else { const h = state.hand[slotRef.i]; if (!h) return { ok: false, why: 'no slot' }; kind = h.kind; w = kind === 'x' ? XW : h.w; }
  if (!w) return { ok: false, why: 'no slot' };
  w = rot(w, k || 0);
  const ev = evalPlacement(state, w, q, r);
  const out = { ok: true, m: ev.m, n: ev.n, gain: 0, events: [] };
  const t = addTile(state, q, r, w, kind);
  if (slotRef.from === 'offer') state.offers[slotRef.i] = genTile(state.rng, deckOf(state));
  else state.hand.splice(slotRef.i, 1);
  if (opts.ferry) state.ferries--;
  if (kind !== 'r') scorePlacement(state, t, ev, out);
  step(state, out.events);
  return out;
}

function scorePlacement(state, t, ev, out) {
  let gain = ev.m;
  const E = out.events;
  // a fit is clean when every edge it touches agrees; tighter spots are worth more
  const clean = ev.n >= 2 && ev.m === ev.n;
  out.fit = clean ? (ev.n >= 4 ? 'perfect' : ev.n >= 3 ? 'snug' : 'clean') : (ev.m === 0 ? 'none' : 'partial');
  if (clean) {
    state.streak++;
    if (ev.n >= 3) { gain += 1; state.stats.snug++; }
    gain += Math.min(state.streak - 1, 4);
    state.meter += ev.n >= 3 ? 2 : 1;
    if (ev.n >= 4) {
      gain += 2 * ev.n;
      state.stats.perfect++;
      grant(state, { kind: 'x' }, E);
      pushEvent(state, E, 'reward', ev.n === 6 ? 'Flawless: all six edges agree. A Plex tile appears in your hand.' : `Perfect fit: all ${ev.n} edges agree. A Plex tile appears in your hand.`);
    }
    while (state.meter >= CFG.METER_MAX) { state.meter -= CFG.METER_MAX; state.choices++; }
  } else state.streak = 0;
  // syzygies: zones summing to nine across a shared edge
  const nbz = [];
  let syz = null;
  for (let i = 0; i < 6; i++) {
    const nb = state.map[key(t.q + DIRS[i][0], t.r + DIRS[i][1])];
    if (!nb || nb.kind === 'r') continue;
    nbz.push(nb.z);
    if (!syz && t.z + nb.z === 9) syz = [t.z, nb.z];
  }
  if (syz && state.level >= 1) {
    gain += 3;
    state.stats.syzygies++;
    const d = mesh(syz[0], syz[1]);
    if (!state.lemurs.some(l => l.d === d)) spawnLemur(state, d, key(t.q, t.r), E, 'syzygy');
    else pushEvent(state, E, 'current', `A ${CURRENTS[Math.abs(syz[0] - syz[1])] || 'Plex'} current hums between zones ${syz[0]} and ${syz[1]} (+3★).`, { quiet: true });
  } else if (out.fit === 'perfect' && state.level >= 1) {
    const others = nbz.filter(z => z !== t.z);
    const z2 = others.length ? others[rint(state.rng, others.length)] : (t.z + 1 + rint(state.rng, 8)) % 10;
    if (z2 !== t.z) spawnLemur(state, mesh(t.z, z2), key(t.q, t.r), E, 'perfect');
  }
  state.stars += gain;
  out.gain = gain;
}

function clearTile(state, q, r) {
  const k = key(q, r);
  if (state.builders <= 0 || !state.map[k] || Object.keys(state.map).length <= 1) return false;
  delete state.map[k];
  state.builders--;
  return true;
}

/* ---------- the living part ---------- */

function step(state, ev) {
  state.turn++;
  commitPending(state, ev);
  const C = clusters(state);
  tagAndTier(state, C, ev);
  updateCurrents(state);
  rules(state, C, ev);
  rumors(state, ev);
  levelUp(state, ev);
  nightDeck(state, ev);
}

function commitPending(state, ev) {
  const byId = {};
  for (const k in state.map) byId[state.map[k].id] = state.map[k];
  const P = state.pending; state.pending = [];
  const late = state.turn > 50;
  for (const p of P) {
    const t = byId[p.id];
    if (!t || t.kind === 'r' || t.w[p.i] !== p.from) continue;
    t.w[p.i] = p.to; t.d[p.i] = 0; t.tg[p.i] = 0; t.z = tileZone(t);
    if (p.cause === 'sprawl') {
      state.stats.sprawl++;
      if (state.stats.firstSelfBuild == null) state.stats.firstSelfBuild = state.turn;
      state.stats.lastSelfBuild = state.turn;
      if (late) state.stats.selfBuildAfter50++;
    } else if (p.cause === 'reclaim') {
      state.stats.reclaim++;
      if (late) state.stats.reclaimAfter50++;
    } else if (p.cause === 'plex') state.stats.wild = (state.stats.wild || 0) + 1;
    else if (p.cause === 'absorb') {
      state.stats.absorbed = (state.stats.absorbed || 0) + 1;
      const G = state.groups[p.tag];
      if (G) { G.absorbed = true; if (G.name) (state.absorbedNames || (state.absorbedNames = [])).push({ id: p.id, i: p.i, name: G.name }); }
    } else {
      state.stats.decline++;
      if (p.cause === 'overheat') state.stats.overheat = (state.stats.overheat || 0) + 1;
    }
  }
  for (const s of state.spawns) {
    if (state.map[s.k]) continue;
    if (s.dream) {
      addTile(state, s.q, s.r, s.w, 'r', { dream: true });
      state.stats.dreams = (state.stats.dreams || 0) + 1;
      if (state.stats.dreams === 1) pushEvent(state, ev, 'dream', 'The data centres have started to dream. If the land believes a dream, it comes true.', { k: s.k });
      continue;
    }
    addTile(state, s.q, s.r, s.w, 'n', { auto: true });
    state.stats.spawn++;
    if (state.stats.firstSelfBuild == null) state.stats.firstSelfBuild = state.turn;
    state.stats.lastSelfBuild = state.turn;
    if (late) state.stats.selfBuildAfter50++;
    const G = state.groups[s.tag];
    pushEvent(state, ev, 'spawn', `${G && G.name ? G.name : 'A metropolis'} laid a tile all by itself.`, { k: s.k });
  }
  state.spawns = [];
}

function clusters(state) {
  const tiles = [], idx = {};
  for (const k in state.map) { const t = state.map[k]; if (t.kind === 'r') continue; idx[k] = tiles.length; tiles.push(t); }
  const n = tiles.length;
  const nb = new Int32Array(n * 6).fill(-1);
  for (let a = 0; a < n; a++) {
    const t = tiles[a];
    for (let i = 0; i < 6; i++) { const b = idx[key(t.q + DIRS[i][0], t.r + DIRS[i][1])]; if (b !== undefined) nb[a * 6 + i] = b; }
  }
  const C = { tiles, idx, nb, byType: {} };
  const par = new Int32Array(n * 6);
  for (const T of LAND) {
    par.fill(-1);
    for (let a = 0; a < n; a++) for (let i = 0; i < 6; i++) { const c = tiles[a].w[i]; if (c === T || c === 'X') par[a * 6 + i] = a * 6 + i; }
    const find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
    const uni = (x, y) => { x = find(x); y = find(y); if (x !== y) { if (x < y) par[y] = x; else par[x] = y; } };
    for (let a = 0; a < n; a++) for (let i = 0; i < 6; i++) {
      const x = a * 6 + i;
      if (par[x] < 0) continue;
      const j = a * 6 + (i + 1) % 6; if (par[j] >= 0) uni(x, j);
      const b = nb[x]; if (b >= 0) { const o = b * 6 + (i + 3) % 6; if (par[o] >= 0) uni(x, o); }
    }
    const groups = new Map();
    for (let x = 0; x < n * 6; x++) {
      if (par[x] < 0) continue;
      if (tiles[(x / 6) | 0].w[x % 6] !== T) continue;
      const r = find(x);
      let g = groups.get(r); if (!g) { g = { T, w: [] }; groups.set(r, g); }
      g.w.push(x);
    }
    const list = [...groups.values()];
    const cid = new Int32Array(n * 6).fill(-1);
    list.forEach((g, gi) => { g.size = g.w.length; g.gi = gi; for (const x of g.w) cid[x] = gi; });
    C.byType[T] = { list, cid };
  }
  return C;
}
function adjW(C, x) {
  const a = (x / 6) | 0, i = x % 6;
  const out = [a * 6 + (i + 1) % 6, a * 6 + (i + 5) % 6];
  const b = C.nb[x]; if (b >= 0) out.push(b * 6 + (i + 3) % 6);
  return out;
}
function wt(C, x) { return C.tiles[(x / 6) | 0].w[x % 6]; }
function getD(C, x) { return C.tiles[(x / 6) | 0].d[x % 6]; }
function setD(C, x, v) { C.tiles[(x / 6) | 0].d[x % 6] = v; }

/* supply a town needs: linear in size, which is what stops one city eating the map
   (a sub-linear version let a seaside city reach 75% of the map in every run) */
function needFor(size) { return Math.ceil(size / CFG.SUPPLY_K); }
function tierOf(T, size) { const TT = CFG.TIERS[T]; let k = -1; for (let i = 0; i < TT.length; i++) if (size >= TT[i]) k = i; return k; }

function tagAndTier(state, C, ev) {
  const turn = state.turn;
  for (const T of LAND) {
    for (const g of C.byType[T].list) {
      let best = 0, bestTier = -99, bestNamed = false;
      const seen = [];
      for (const x of g.w) {
        const tg = C.tiles[(x / 6) | 0].tg[x % 6];
        if (!tg || seen.includes(tg)) continue;
        seen.push(tg);
        const G = state.groups[tg];
        if (!G || G.T !== T) continue;
        const named = !!G.name;
        if (named > bestNamed || (named === bestNamed && (G.tier > bestTier || (G.tier === bestTier && tg < best)))) { best = tg; bestTier = G.tier; bestNamed = named; }
      }
      if (!best || !state.groups[best]) { best = state.nextTag++; state.groups[best] = { T, tier: -1, born: turn }; }
      const G = state.groups[best];
      for (const x of g.w) C.tiles[(x / 6) | 0].tg[x % 6] = best;
      // absorbed groups
      for (const tg of seen) {
        if (tg === best) continue;
        const O = state.groups[tg];
        if (O && O.T === T) {
          if (T === 'H' && O.name && G.name) pushEvent(state, ev, 'merge', `${O.name} and ${G.name} grew into one place. It keeps the name ${G.name}.`);
          G.tier = Math.max(G.tier, O.tier);
          delete state.groups[tg];
        }
      }
      g.tag = best; G.size = g.size; G.seen = turn;
      const tier = tierOf(T, g.size);
      if (tier > G.tier) { for (let k = Math.max(0, G.tier + 1); k <= tier; k++) onTier(state, G, k, g, C, ev); G.tier = tier; }
    }
  }
  // a data centre that absorbed part of a named town takes the town's name, if it has none yet
  if (state.absorbedNames && state.absorbedNames.length) {
    const byId = {}; for (const t of C.tiles) byId[t.id] = t;
    for (const a of state.absorbedNames) {
      const t = byId[a.id]; if (!t || t.w[a.i] !== 'D') continue;
      const G = state.groups[t.tg[a.i]];
      if (!G || G.T !== 'D' || G.name) continue;
      G.name = a.name; G.aq = aqOf(a.name); G.zone = dr(G.aq);
      pushEvent(state, ev, 'absorb', `${a.name} is becoming a data centre.`);
    }
    state.absorbedNames = [];
  }
  for (const tg in state.groups) {
    const G = state.groups[tg];
    if (G.seen !== turn) {
      if (G.T === 'H' && G.name) pushEvent(state, ev, 'lost', G.absorbed ? `${G.name} is part of a data centre now.` : `The Outside took ${G.name} back. Only meadow remains.`);
      delete state.groups[tg];
    }
  }
}

function onTier(state, G, k, g, C, ev) {
  if (k === 0) return;
  if (G.T === 'H') {
    if (k === 1) {
      let oldest = g.w[0];
      for (const x of g.w) if (C.tiles[(x / 6) | 0].id < C.tiles[(oldest / 6) | 0].id) oldest = x;
      const home = C.tiles[(oldest / 6) | 0];
      G.name = genName(state.rng);
      G.aq = aqOf(G.name); G.zone = dr(G.aq); G.homeZone = home.z; G.homed = G.zone === home.z;
      pushEvent(state, ev, 'village', state.level >= 2 ? `A village named itself ${G.name}. AQ ${G.aq} → zone ${G.zone}.` : `A village named itself ${G.name}.`);
      if (G.homed && state.level >= 2) pushEvent(state, ev, 'homed', `${G.name}'s name comes home: it plexes to zone ${G.zone}, the zone it was founded on. It will grow faster.`);
    } else if (k === 2) {
      G.townSince = state.turn;
      state.builders++;
      pushEvent(state, ev, 'town', `${G.name || 'A village'} is a town now. (+1 builder)`);
    } else if (k === 3) {
      state.builders++;
      pushEvent(state, ev, 'city', `${G.name || 'A town'} reached critical mass. It is a city, and it will start building itself. (+1 builder)`);
    } else if (k === 4) {
      state.builders += 2;
      pushEvent(state, ev, 'metro', `${G.name || 'A metropolis'} is a metropolis. It has started laying its own tiles. (+2 builders)`);
    }
  } else if (G.T === 'S') {
    const add = k === 3 ? 2 : 1;
    state.ferries += add;
    const txt = k === 1 ? 'A lake has formed. A ferry is ready (+1).' : k === 2 ? 'The lake became a sea. Boats everywhere (+1 ferry).' : 'The Lemurian sea surfaces (+2 ferries).';
    pushEvent(state, ev, 'sea', txt);
  } else if (G.T === 'J') {
    if (k === 1) pushEvent(state, ev, 'jungle', 'The Outside thickens. Untended land next to it is at risk now.');
    if (k === 2) {
      pushEvent(state, ev, 'jungle', 'Deep jungle. Something lives in there.');
      const x = g.w[rint(state.rng, g.w.length)]; const t = C.tiles[(x / 6) | 0];
      spawnLemur(state, rint(state.rng, DEMONS.length), key(t.q, t.r), ev, 'jungle');
    }
  } else if (G.T === 'F') {
    const bonus = k === 1 ? 5 : 10;
    state.stars += bonus;
    pushEvent(state, ev, 'harvest', `A big harvest. The corpus grows (+${bonus}★).`);
  }
}

function mostExposed(C, ws, T, st) {
  let best = [], bestScore = -1;
  for (const x of ws) {
    const d = getD(C, x);
    let e = C.nb[x] < 0 ? 1 : 0;
    for (const y of adjW(C, x)) if (wt(C, y) !== T) e++;
    const score = d * 10 + e; // keep chewing on the wedge already decaying
    if (score > bestScore) { bestScore = score; best = [x]; } else if (score === bestScore) best.push(x);
  }
  return best[rint(st, best.length)];
}

function rules(state, C, ev) {
  const H = C.byType.H, F = C.byType.F, J = C.byType.J, S = C.byType.S;
  const st = state.rng, P = state.pending;
  const pend = new Set();
  const fx = currentFx(state);
  const tid = x => C.tiles[(x / 6) | 0].id;
  const held = x => fx.hold.has(tid(x));
  const tick = x => fx.warp.has(tid(x)) ? 2 : 1; // Warp: decay runs twice as fast
  const sunk = x => fx.sunk.has(tid(x));          // Sink: cities lose their protection
  const addP = (x, to, cause, tag) => {
    const t = C.tiles[(x / 6) | 0], i = x % 6, k = t.id + ':' + i;
    if (pend.has(k) || t.w[i] === to || t.w[i] === 'X' || fx.hold.has(t.id)) return false;

  };

  // hamlets: supply from adjacent fields and sea; shared seas mean trade
  const seaTowns = new Map();
  for (const g of H.list) {
    const sup = new Set();
    for (const x of g.w) for (const y of adjW(C, x)) {
      const c = wt(C, y);
      if (c === 'F' || c === 'S') {
        sup.add(y);
        if (c === 'S') { const sg = S.cid[y]; if (sg >= 0) { if (!seaTowns.has(sg)) seaTowns.set(sg, new Set()); seaTowns.get(sg).add(g.gi); } }
      }
    }
    g.supply = sup.size; g.need = needFor(g.size);
  }
  for (const hs of seaTowns.values()) if (hs.size >= 2) for (const gi of hs) H.list[gi].trade = true;
  // a city holds its ground against the jungle unless it is starving badly
  for (const g of H.list) g.shield = g.size >= CFG.CITY && 2 * g.supply >= g.need;

  for (const g of H.list) {
    if (g.supply >= g.need) { g.fed = true; for (const x of g.w) setD(C, x, 0); continue; }
    g.fed = false;
    if (g.size < CFG.STARVE_MIN) continue;
    const free = fx.hold.size ? g.w.filter(x => !held(x)) : g.w; // Hold: no decay in its area
    if (free.length) {
      const x = mostExposed(C, free, 'H', st);
      const d = getD(C, x) + tick(x); setD(C, x, d);
      // a starving hamlet wedge beside a data centre becomes part of it instead of meadow
      if (d >= CFG.DECAY_T) {
        if (adjW(C, x).some(y => wt(C, y) === 'D')) addP(x, 'D', 'absorb', g.tag);
        else addP(x, 'M', 'starve');
      }
    }
    const G = state.groups[g.tag];
    if (G && G.name && G.tier >= 2 && (G.warned == null || state.turn - G.warned > 25)) {
      G.warned = state.turn;
      pushEvent(state, ev, 'hungry', `${G.name} is hungry. It needs fields or sea next to it.`);
    }
  }

  // data centres: cooled by sea, one contact per COOL_K wedges; a hot cluster sheds its most exposed wedge to meadow
  for (const g of C.byType.D.list) {
    const sea = new Set();
    for (const x of g.w) for (const y of adjW(C, x)) if (wt(C, y) === 'S') sea.add(y);
    g.cool = sea.size; g.coolNeed = Math.ceil(g.size / CFG.COOL_K);
    state.stats.dcSteps = (state.stats.dcSteps || 0) + 1;
    if (g.cool >= g.coolNeed) { g.cooled = true; state.stats.dcCooled = (state.stats.dcCooled || 0) + 1; for (const x of g.w) setD(C, x, 0); continue; }
    g.cooled = false;
    const free = fx.hold.size ? g.w.filter(x => !held(x)) : g.w;
    if (!free.length) continue;
    const x = mostExposed(C, free, 'D', st);
    const d = getD(C, x) + tick(x); setD(C, x, d);
    if (d >= CFG.DECAY_T) addP(x, 'M', 'overheat');
  }

  // dreaming: every DREAM_EVERY steps a cooled data centre queues a rumor on one of its open edges,
  // made of the hamlet, field, jungle and sea wedges it touches
  const planned = new Set(state.spawns.map(s => s.k));
  if (CFG.DREAM_EVERY > 0) for (const g of C.byType.D.list) {
    const G = state.groups[g.tag];
    if (!g.cooled || !G) continue;
    if (G.lastDream == null) G.lastDream = state.turn;
    if (state.turn - G.lastDream < CFG.DREAM_EVERY) continue;
    const cells = [], touch = { H: 0, F: 0, J: 0, S: 0 }, seen = new Set();
    for (const x of g.w) {
      for (const y of adjW(C, x)) { const c = wt(C, y); if (c in touch && !seen.has(y)) { seen.add(y); touch[c]++; } }
      if (C.nb[x] >= 0) continue;
      const t = C.tiles[(x / 6) | 0], i = x % 6, q = t.q + DIRS[i][0], r = t.r + DIRS[i][1], kk = key(q, r);

  // At city tier a town of 12+ wakes up under the usual rule, so a settled world starts moving again.
  for (const g of H.list) {

    if (!G || !G.name) continue;

      G.flat = g.size; G.flatSince = state.turn; G.flatTier = G.tier; continue;
    }
    if (G.tier < 1 || G.tier >= 3 || g.size < CFG.GROK_MIN || state.turn - G.flatSince < CFG.GROK_T) continue;
    G.tier++; state.builders++; state.stats.groks = (state.stats.groks || 0) + 1;
    if (G.tier === 2) G.townSince = state.turn;

    const cand = fx.hold.size ? nearJ.filter(x => !held(x)) : nearJ;
    if (!cand.length) continue;

    for (const y of cand) if (getD(C, y) > getD(C, x)) x = y;
    if (getD(C, x) === 0) x = cand[rint(st, cand.length)];

      if (fx.hold.has(t.id)) continue;
      const a = C.idx[key(t.q, t.r)];

    for (const x of ws) { const d = getD(C, x); if (d > top) { top = d; best = [x]; } else if (d === top) best.push(x); }
    const x = best[rint(st, best.length)];
    const d = getD(C, x) + tick(x); setD(C, x, d);

    const w = [];
    for (let i = 0; i < 6; i++) {
      const nb = state.map[key(q + DIRS[i][0], r + DIRS[i][1])];
      const c = nb && nb.kind !== 'r' ? nb.w[(i + 3) % 6] : 'H';

function rumors(state, ev) {
  for (const k of Object.keys(state.map)) {
    const t = state.map[k];

    let ok = 0;
    for (let i = 0; i < 6; i++) {
      const nb = state.map[key(t.q + DIRS[i][0], t.r + DIRS[i][1])];

let state = null, view = { info: {}, labels: [], seas: [] }, idMap = {}, currents = [], tint = {};
let cam = { x: 0, y: 0, s: 46 };

const ui = { sel: { from: 'offer', i: 0 }, ghost: null, mode: 'place', clearKey: null, valid: [], undo: [], floaters: [], pointerW: [0, 0], dirty: true, last: 0, cy: 0, sheetAt: 0 };

/* ---------- geometry ---------- */
function hexCenter(q, r) { return [1.5 * q, SQ3 * (r + q / 2)]; }
function cubeRound(q, r) {
  const x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}
function pixelToHex(wx, wy) { return cubeRound(2 / 3 * wx, -1 / 3 * wx + SQ3 / 3 * wy); }
function toScreen(wx, wy) { return [(wx - cam.x) * cam.s + W / 2, (wy - cam.y) * cam.s + ui.cy]; }
function toWorld(sx, sy) { return [(sx - W / 2) / cam.s + cam.x, (sy - ui.cy) / cam.s + cam.y]; }
function hh(a, b) { let x = Math.imul(a | 0, 73856093) ^ Math.imul((b | 0) + 1, 19349663); x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function wpt(i, u, v) { const A = CORN[i], B = CORN[(i + 1) % 6]; return [A[0] * u + B[0] * v, A[1] * u + B[1] * v]; }
function zoneOfW(w) { return w[0] === 'X' ? 0 : S.dr(S.aqOf(w.join(''))); }

/* ---------- state plumbing ---------- */
function selectedTile() {
  const slots = S.slotTiles(state);
  return slots.find(s => s.from === ui.sel.from && s.i === ui.sel.i) || slots[0];
}
function bestRot(st, q, r, prefer) {
  let best = null;
  const rots = st.kind === 'x' ? 1 : 6;
  for (let k = 0; k < rots; k++) {
    const e = S.evalPlacement(state, S.rot(st.w, k), q, r);
    if (!best || e.m > best.m || (e.m === best.m && k === prefer)) best = { k, m: e.m, n: e.n };
  }
  return best;
}
function computeValid() {
  ui.valid = [];
  if (ui.mode === 'builder') return;
  const cells = ui.mode === 'ferry' ? S.ferryCells(state, 3) : S.frontier(state);
  const st = selectedTile();
  for (const [q, r] of cells) { const b = bestRot(st, q, r); ui.valid.push({ q, r, m: b.m, n: b.n }); }
}
function refresh() {
  idMap = {};
  for (const k in state.map) idMap[state.map[k].id] = state.map[k];
  view = S.view(state);
  // currents as the rules see them, with the tiles at each end and a light tint over each area
  currents = []; tint = {};
  for (const c of S.activeCurrents(state)) {
    const a = idMap[c.a], b = idMap[c.b]; if (!a || !b) continue;
    const col = REGION_COL[S.region(c.hi - c.lo)], area = S.currentArea(state, c);
    currents.push({ c, a, b, col, area: new Set(area.map(t => t.id)) });
    for (const t of area) (tint[t.id] || (tint[t.id] = new Set())).add(col);
  }
  if (ui.ghost && state.map[S.key(ui.ghost.q, ui.ghost.r)]) ui.ghost = null;
  if (ui.mode === 'ferry' && state.ferries <= 0) ui.mode = 'place';
  if (ui.mode === 'builder' && state.builders <= 0) { ui.mode = 'place'; ui.clearKey = null; }
  computeValid();
  renderTray(); renderHud(); updateTools(); updateHint();
  ui.dirty = true;
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ state, cam })); } catch (e) { /* storage may be unavailable */ }
}
function pushUndo() { ui.undo.push(JSON.stringify(state)); if (ui.undo.length > 30) ui.undo.shift(); }

function greedyStep() {
  const slots = S.slotTiles(state).filter(s => s.from === 'offer');
  let best = null;
  for (const s of slots) for (const [q, r] of S.frontier(state)) for (let k = 0; k < 6; k++) {
    const e = S.evalPlacement(state, S.rot(s.w, k), q, r);
    const sc = e.m * 10 + e.n;
    if (!best || sc > best.sc) best = { sc, s, q, r, k };
  }
  S.place(state, { from: best.s.from, i: best.s.i }, best.q, best.r, best.k);
}
function newWorld() {
  const seed = (Math.random() * 4294967296) >>> 0;
  state = S.newGame(seed);
  for (let i = 0; i < 5; i++) greedyStep(); // the seed island
  state.events = [{ turn: state.turn, kind: 'start', txt: 'A small island to begin with. Everything after this is yours.' }];
  cam = { x: 0, y: 0, s: 46 };
  ui.undo = []; ui.ghost = null; ui.mode = 'place'; ui.sel = { from: 'offer', i: 0 };
  refresh(); fitView(false); save();
}

/* ---------- actions ---------- */
function selectSlot(s) {
  ui.sel = { from: s.from, i: s.i };
  if (ui.mode === 'builder') { ui.mode = 'place'; ui.clearKey = null; }
  if (ui.ghost) ui.ghost.k = bestRot(selectedTile(), ui.ghost.q, ui.ghost.r, ui.ghost.k).k;
  computeValid(); renderTray(); updateTools(); updateHint(); ui.dirty = true;
}
function rotateGhost() {
  if (!ui.ghost || selectedTile().kind === 'x') return;
  ui.ghost.k = (ui.ghost.k + 1) % 6;
  updateTools(); updateHint(); ui.dirty = true;
}
function doPlace() {
  if (ui.mode === 'builder') return doClear();
  if (!ui.ghost) return;
  const g = ui.ghost, before = JSON.stringify(state);
  const res = S.place(state, ui.sel, g.q, g.r, g.k, { ferry: ui.mode === 'ferry' });
  if (!res.ok) { hintEl.textContent = 'That spot is not available right now.'; return; }
  ui.undo.push(before); if (ui.undo.length > 30) ui.undo.shift();
  const c = hexCenter(g.q, g.r);
  if (res.gain) floater(c[0], c[1] - 0.2, '+' + res.gain + '★', '#1E2B2F');
  if (res.fit === 'perfect' || res.fit === 'snug') floater(c[0], c[1] + 0.35, res.fit === 'perfect' ? 'perfect' : 'snug', '#1F9C84');
  if (ui.mode === 'ferry') ui.mode = 'place';
  if (ui.sel.from === 'hand') ui.sel = { from: 'offer', i: 0 };

}
function doClear() {
  if (!ui.clearKey) return;
  const before = JSON.stringify(state);
  if (!S.clearTile(state, ...ui.clearKey.split(',').map(Number))) { hintEl.textContent = 'That tile cannot be cleared.'; return; }
  ui.undo.push(before);
  ui.clearKey = null; ui.mode = 'place';
  refresh(); save();
}
function doUndo() {
  if (!ui.undo.length) return;
  state = JSON.parse(ui.undo.pop());
  ui.ghost = null; ui.mode = 'place'; ui.clearKey = null;
  if (!S.slotTiles(state).some(s => s.from === ui.sel.from && s.i === ui.sel.i)) ui.sel = { from: 'offer', i: 0 };
  closeSheet(); refresh(); save();
}
function toggleMode(m) {
  ui.mode = ui.mode === m ? 'place' : m;
  ui.clearKey = null; ui.ghost = null;
  computeValid(); updateTools(); updateHint(); ui.dirty = true;
}

/* ---------- HUD, tray, hints ---------- */
function renderHud() {
  $('stars').textContent = state.stars;
  $('meter').style.width = (100 * state.meter / S.CFG.METER_MAX).toFixed(1) + '%';
  [...$('pips').children].forEach((p, i) => p.classList.toggle('on', state.level > i));
  $('pips').title = 'Weirdness ' + state.level + ' of 4';
  $('giftChip').hidden = state.choices <= 0;
}
function drawMini(c, s, big) {
  const g = c.getContext('2d'), R = c.width * 0.43, cx = c.width / 2, cy = c.height / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.save(); g.translate(cx, cy);
  if (s.kind === 'r') g.globalAlpha = 0.6;
  for (let i = 0; i < 6; i++) {
    const A = CORN[i], B = CORN[(i + 1) % 6], col = s.w[i] === 'X' ? `hsl(${i * 60 + 300}, 72%, 80%)` : COL[s.w[i]];
    g.beginPath(); g.moveTo(0, 0); g.lineTo(A[0] * R, A[1] * R); g.lineTo(B[0] * R, B[1] * R); g.closePath();
    g.fillStyle = col; g.fill(); g.strokeStyle = col; g.lineWidth = 1.5; g.stroke();
  }
  g.globalAlpha = 1;
  g.beginPath(); for (let i = 0; i < 6; i++) { const p = CORN[i]; i ? g.lineTo(p[0] * R, p[1] * R) : g.moveTo(p[0] * R, p[1] * R); } g.closePath();
  g.lineWidth = s.kind === 'r' ? 3 : 2; g.strokeStyle = s.kind === 'r' ? '#6E4FD0' : s.kind === 'x' ? '#C23B5A' : 'rgba(30,43,47,.25)';
  if (s.kind === 'r') g.setLineDash([7, 5]);
  g.stroke(); g.setLineDash([]);
  if (state.level >= 1 || big) {
    const z = zoneOfW(s.w);
    g.font = `${Math.round(R * 0.62)}px "Major Mono Display", monospace`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,.9)'; g.strokeText(String(z), 0, 2);
    g.fillStyle = REGION_COL[S.region(z)]; g.fillText(String(z), 0, 2);
  }
  g.restore();
}
function renderTray() {
  const slots = S.slotTiles(state);

  slotsEl.innerHTML = '';

    if (n === state.offers.length && state.hand.length) { const d = document.createElement('div'); d.className = 'sep'; slotsEl.appendChild(d); }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'slot' + (s.from === 'hand' ? ' gift ' + s.kind : '');
    b.id = 'slot-' + s.from + '-' + s.i;
    b.setAttribute('aria-pressed', String(s.from === ui.sel.from && s.i === ui.sel.i));
    const label = s.kind === 'x' ? 'Plex' : s.kind === 'r' ? 'Rumor' : s.w.map(c => TERRAIN[c][0]).join('');
    b.setAttribute('aria-label', s.kind === 'x' ? 'Plex tile, matches every edge' : s.kind === 'r' ? 'Rumor tile' : 'Tile ' + s.w.map(c => TERRAIN[c]).join(', '));
    const c = document.createElement('canvas'); c.width = 100; c.height = 100; drawMini(c, s);
    const sm = document.createElement('small'); sm.textContent = s.from === 'hand' ? label : (state.level >= 1 ? 'zone ' + zoneOfW(s.w) : '\u00a0');

}
function updateTools() {
  const place = $('placeBtn'), rot = $('rotBtn');
  if (ui.mode === 'builder') { place.textContent = 'Clear tile'; place.disabled = !ui.clearKey; }
  else { place.textContent = ui.mode === 'ferry' ? 'Ferry here' : 'Place'; place.disabled = !ui.ghost; }
  rot.disabled = !ui.ghost || selectedTile().kind === 'x' || ui.mode === 'builder';
  $('undoBtn').disabled = !ui.undo.length;
  const bb = $('buildBtn'), fb = $('ferryBtn');
  bb.hidden = state.builders <= 0 && ui.mode !== 'builder'; $('buildN').textContent = state.builders; bb.classList.toggle('on', ui.mode === 'builder');
  fb.hidden = state.ferries <= 0 && ui.mode !== 'ferry'; $('ferryN').textContent = state.ferries; fb.classList.toggle('on', ui.mode === 'ferry');
}
function ghostEval() {
  const st = selectedTile(), w = S.rot(st.w, ui.ghost.k);
  const e = S.evalPlacement(state, w, ui.ghost.q, ui.ghost.r);
  const z = zoneOfW(w);
  const opens = []; // currents this placement would open; a rumor opens none until it is real
  if (st.kind !== 'r') for (const d of S.DIRS) {
    const nb = state.map[S.key(ui.ghost.q + d[0], ui.ghost.r + d[1])];
    if (!nb || nb.kind === 'r' || nb.z + z !== 9) continue;
    const hi = Math.max(z, nb.z), name = S.CURRENTS[2 * hi - 9];
    if (!opens.some(o => o.name === name)) opens.push({ name, hi, lo: 9 - hi });
  }
  return { st, w, e, z, opens };

function updateHint() {
  let txt;
  if (ui.mode === 'builder') txt = ui.clearKey ? 'Tap Clear tile to remove it. You can build on the empty spot.' : 'Builder: tap any tile to clear it.';
  else if (ui.ghost) {
    const { st, e, opens } = ghostEval();
    if (st.kind === 'r') txt = `A rumor. It becomes real once ${S.CFG.RUMOR_NEED} neighbours agree with its edges.`;
    else {
      const clean = e.n >= 2 && e.m === e.n;
      txt = clean ? (e.n >= 4 ? 'Perfect fit' : e.n >= 3 ? 'Snug fit' : 'Clean fit') : `${e.m} of ${e.n} edges match`;
      txt += ` · +${e.m}★`;
      if (opens.length && state.level >= 1) txt += ' · opens ' + opens.map(o => `a ${o.name} current (${o.hi}::${o.lo})`).join(' and ');
      if (st.kind !== 'x') txt += '. Tap the tile to turn it.';
      if (st.w.includes('D')) txt += ' Data centres need sea next to them.';
    }

/* ---------- toasts and floaters ---------- */
function showEvents(evs, at) {
  let shown = 0;
  for (const e of evs) {
    if (e.quiet) { if (at) floater(at[0], at[1] + 0.05, 'current +3★', '#C23B5A'); continue; }
    if (shown++ < 2) toast(e);
  }
}
function toast(e) {
  const d = document.createElement('div');
  d.className = 'toast ' + e.kind; d.textContent = e.txt;
  toastsEl.appendChild(d);
  while (toastsEl.children.length > 2) toastsEl.firstChild.remove();
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 450); }, 3800 + Math.min(3500, e.txt.length * 25));
}
function floater(wx, wy, txt, col) { ui.floaters.push({ wx, wy, txt, col, born: performance.now() }); ui.dirty = true; }

/* ---------- sheets ---------- */
function openSheet(html) { sheet.innerHTML = html; scrim.hidden = false; ui.sheetAt = performance.now(); const f = sheet.querySelector('button'); if (f) f.focus({ preventScroll: true }); }
function closeSheet() { scrim.hidden = true; sheet.innerHTML = ''; }
// a tap on the board opens a sheet on pointerup, and the same tap's click then lands on the new scrim
scrim.addEventListener('click', e => { if (e.target === scrim && performance.now() - ui.sheetAt > 400) closeSheet(); });

function openGift() {
  openSheet(`
    <h2>The land has a gift for you</h2>
    <p class="note">Pick one. It goes into your tray.</p>
    <div class="choices">
      <button type="button" class="choice" id="pickPlex"><canvas width="116" height="116" id="cx"></canvas><span><b>Plex tile</b><span>${S.shares(state).X >= S.CFG.PLEX_CAP ? 'Wild land is plentiful right now, so this gives +5★ instead of a tile.' : 'Matches every edge. It joins clusters of every kind without adding to their size, so it works as a bridge between two towns, two seas or two jungles.'}</span></span></button>
      <button type="button" class="choice" id="pickRumor"><canvas width="116" height="116" id="cr"></canvas><span><b>Rumor</b><span>A ghost tile. Once ${S.CFG.RUMOR_NEED} neighbours agree with its edges it becomes real, with +10★ and a visitor. If nobody believes it within ${S.CFG.RUMOR_LIFE} placements, it fades.</span></span></button>
    </div>
    <button type="button" class="btn sheet-close" id="later">Decide later</button>`);
  drawMini($('cx'), { kind: 'x', w: S.XW }, true);
  drawMini($('cr'), { kind: 'r', w: ['H', 'H', 'S', 'S', 'J', 'J'] }, false);
  const pick = which => {
    pushUndo();
    const evs = S.choose(state, which) || [];
    showEvents(evs);
    const slots = S.slotTiles(state); const s = slots[slots.length - 1];
    ui.sel = { from: s.from, i: s.i };
    refresh(); save();
    if (state.choices > 0) openGift(); else closeSheet();
  };
  $('pickPlex').addEventListener('click', () => pick('x'));
  $('pickRumor').addEventListener('click', () => pick('r'));
  $('later').addEventListener('click', closeSheet);
}

function townOf(tl) {
  for (let i = 0; i < 6; i++) if (tl.w[i] === 'H' && tl.tg[i] && state.groups[tl.tg[i]] && state.groups[tl.tg[i]].name) return state.groups[tl.tg[i]];
  return null;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
/* the data centre a tile belongs to: its size, sea contacts against the need, and the town name it took */
function dataCentreOf(tl) {
  const i = tl.w.indexOf('D'); if (i < 0) return null;
  const inf = (view.info[tl.id] || [])[i]; if (!inf) return null;
  const G = state.groups[inf.tag];
  return { size: inf.size, cool: inf.cool, need: inf.need, name: G && G.name };
}
function openInspector(tl) {
  const L = state.level, z = tl.z, reg = S.region(z);
  const counts = {}; for (const c of tl.w) counts[c] = (counts[c] || 0) + 1;
  const chips = Object.keys(counts).map(c => `<span class="chip"><i class="dot" style="background:${COL[c]}"></i>${TERRAIN[c]} ×${counts[c]}</span>`).join('');
  const town = townOf(tl), dc = tl.kind === 'r' ? null : dataCentreOf(tl);
  let title = tl.kind === 'x' ? 'A Plex tile' : tl.kind === 'r' ? (tl.dream ? 'A dream' : 'A rumor') : town ? esc(town.name) : dc && dc.name ? esc(dc.name) : Object.keys(counts).map(c => TERRAIN[c]).join(' and ');
  let lines = '';
  if (town) {
    const tier = S.tierOf('H', town.size || 0);
    lines += `<p>A ${TIER_H[Math.max(0, tier)]} of ${town.size} hamlet wedges${town.building ? ' that builds itself' : ''}.</p>`;
    if (L >= 2 && town.aq != null) lines += `<p class="readout">AQ ${esc(town.name)} = ${town.aq} → zone ${town.zone}${town.homed ? ' · the name comes home' : ''}</p>`;

/* faint by day, bright at night; a current fades out while it lingers after its syzygy breaks */

function drawValid() {

function drawGhost(t) {

function drawText(now) {

    .concat((view.dlabels || []).filter(l => l.size >= S.CFG.TIERS.H[1]).sort((a, b) => b.size - a.size).map(l => Object.assign({ dc: true }, l)));

function draw(now) {

/* ---------- camera and input ---------- */
function resize() {

const pts = new Map(); let gest = null, camSaveT = 0;

cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function hitLemur(wx, wy) {
  const t = performance.now() / 1000;
  let best = null, bd = 0.3;
  for (const l of state.lemurs) { const [x, y] = lemurPos(l, t); const d = Math.hypot(x - wx, y - wy); if (d < bd) { bd = d; best = l; } }
  return best;
}
function onTap(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  const lm = hitLemur(wx, wy);

  const [q, r] = pixelToHex(wx, wy), k = S.key(q, r), tile = state.map[k];

  }
  if (tile) { openInspector(tile); return; }
  ui.ghost = null; updateTools(); updateHint(); ui.dirty = true;

$('placeBtn').addEventListener('click', doPlace);
$('rotBtn').addEventListener('click', rotateGhost);
$('undoBtn').addEventListener('click', doUndo);

document.addEventListener('keydown', e => {
  if (!scrim.hidden) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'r' || e.key === 'R') rotateGhost();
  else if (e.key === 'Enter') doPlace();
  else if (e.key === 'z' || e.key === 'Z') doUndo();
});
window.addEventListener('resize', () => { resize(); });

/* ---------- boot ---------- */
function start(data) {
  let loaded = null;
  try { if (data && data.state) loaded = { state: JSON.parse(data.state), cam: data.cam }; } catch (e) { loaded = null; }
  if (!loaded) { try { const raw = localStorage.getItem(STORE); if (raw) loaded = JSON.parse(raw); } catch (e) { loaded = null; } }

else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
