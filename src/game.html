<title>Numogarden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=Major+Mono+Display&display=swap">
<style>
/* Layout: a one-screen toy. The board fills the screen; a small readout floats at the top, the tray of tiles and tools sits at the bottom,
   and sheets slide up for gifts, lore and the chronicle. One deliberate look: a pastel world that dusks as it gets weirder. */
:root {
  --ground: #D9E5DE;
  --panel: #F6FAF7;
  --well: #E7EFEA;
  --ink: #1E2B2F;
  --muted: #586A6C;
  --rule: #B7C9C1;
  --tc: #9A7A00;      /* Numogram region colours, as in Numogram Lab */
  --warp: #6E4FD0;
  --plex: #C23B5A;
  --fit: #1F9C84;
  --display: "Major Mono Display", "IBM Plex Mono", ui-monospace, monospace;
  --ui: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.35;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--plex); outline-offset: 2px; }

.hud {
  position: absolute; top: 8px; left: 0; right: 0; z-index: 3;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.brand {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 7px 11px 8px;
  display: grid; gap: 5px; box-shadow: 0 2px 0 rgba(30, 43, 47, .07); min-width: 0;
}
.wordmark { font-family: var(--display); font-size: 15px; line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.stats { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats b { font-weight: 500; color: var(--ink); }
.meter { width: 58px; height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--tc), var(--plex)); transition: width .35s ease; }
.pips { display: inline-flex; gap: 3px; }
.pips span { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--plex); box-sizing: border-box; }
.pips span.on { background: var(--plex); }
.hud-right { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.icon {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 2px 0 rgba(30, 43, 47, .07);
}
.icon svg { width: 20px; height: 20px; }
.gift-chip {
  height: 40px; border-radius: 12px; border: 1px solid var(--plex); background: var(--plex); color: #FFF5F7;
  padding: 0 12px; font-weight: 600; cursor: pointer; animation: nudge 1.6s ease-in-out infinite;
}
@keyframes nudge { 50% { transform: translateY(-2px); } }

.toasts {
  position: absolute; top: 76px; left: 0; right: 0; z-index: 4; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; justify-items: center; gap: 6px;
}
.toast {
  max-width: 400px; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--tc);
  border-radius: 12px; padding: 6px 11px; font-size: 13.5px; line-height: 1.28; box-shadow: 0 4px 14px rgba(30, 43, 47, .14);
  animation: pop .28s ease-out; transition: opacity .4s, transform .4s;
}
.toast.out { opacity: 0; transform: translateY(-6px); }
.toast.lemur, .toast.rumor, .toast.faded, .toast.dc, .toast.absorb, .toast.dream { border-left-color: var(--warp); }
.toast.level, .toast.reward, .toast.metro, .toast.spawn { border-left-color: var(--plex); }
.toast.lost, .toast.hungry, .toast.jungle { border-left-color: #3B8558; }
.toast.sea { border-left-color: #3E9CC0; }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

.tray {
  position: absolute; left: 0; right: 0; bottom: 8px; z-index: 3; pointer-events: none;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  display: grid; gap: 7px; justify-items: center;
}
.hint {
  max-width: min(100%, 460px); background: rgba(246, 250, 247, .94); border: 1px solid var(--rule); border-radius: 999px;
  padding: 5px 13px; font-size: 14px; line-height: 1.25; text-align: center; pointer-events: auto; text-wrap: balance;
}
.dock {
  width: 100%; max-width: 560px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--rule); border-radius: 18px;
  padding: 8px; display: grid; gap: 8px; pointer-events: auto; box-shadow: 0 -1px 0 rgba(30, 43, 47, .04), 0 6px 18px rgba(30, 43, 47, .10);
}
.slots { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.slots::-webkit-scrollbar { display: none; }
.slot {
  flex: none; width: 62px; height: 70px; border-radius: 14px; border: 2px solid transparent; background: var(--well);
  display: grid; justify-items: center; align-content: center; padding: 0; cursor: pointer; transition: transform .15s;
}
.slot canvas { width: 50px; height: 50px; display: block; }
.slot small { font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.1; margin-top: 1px; }
.slot[aria-pressed="true"] { border-color: var(--ink); background: #FFFFFF; transform: translateY(-2px); }
.slot.gift { background: #F6E7EC; }
.slot.gift.r { background: #ECE7F8; }
.sep { flex: none; width: 1px; background: var(--rule); margin: 6px 1px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  flex: 1 1 0; min-width: 62px; min-height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--well);
  font-weight: 600; font-size: 14px; padding: 4px 6px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.btn.primary { flex: 1.7 1 0; background: var(--ink); border-color: var(--ink); color: #F6FAF7; }
.btn.on { border-color: var(--plex); background: #FBE9EE; }
.btn:disabled { opacity: .38; cursor: default; }
.btn .n { font-family: var(--mono); font-size: 11px; background: rgba(30, 43, 47, .1); border-radius: 6px; padding: 1px 5px; }
.btn.primary .n { background: rgba(255, 255, 255, .18); }

.scrim { position: absolute; inset: 0; z-index: 6; background: rgba(30, 43, 47, .32); display: grid; align-items: end; justify-items: center; }
.scrim.light { background: rgba(30, 43, 47, .12); } /* the inspector: the board above it stays readable */
.sheet {
  width: 100%; max-width: 560px; box-sizing: border-box; background: var(--panel); border-radius: 22px 22px 0 0;
  padding-block: 18px 20px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  max-height: 82%; overflow-y: auto; display: grid; gap: 12px; animation: rise .25s ease-out; -webkit-user-select: text; user-select: text;
}
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }
.sheet h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 700; text-wrap: balance; }
.sheet h3 { margin: 6px 0 0; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; max-width: 62ch; }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; max-width: 62ch; }
.sheet .readout { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet .note { font-size: 13px; color: var(--muted); }
.sheet a { color: var(--ink); text-underline-offset: 3px; }
.sheet-close { justify-self: stretch; }
.choices { display: grid; gap: 10px; }
.choice {
  display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
  border: 1.5px solid var(--rule); background: #FFFFFF; border-radius: 16px; padding: 10px 12px; cursor: pointer;
}
.choice:hover { border-color: var(--ink); }
.choice canvas { width: 58px; height: 58px; }
.choice b { display: block; font-size: 17px; }
.choice span { display: block; font-size: 14px; color: var(--muted); line-height: 1.3; }
.lname { font-family: var(--display); font-weight: 400 !important; font-size: 26px !important; letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--mono); font-size: 12px; border-radius: 8px; padding: 2px 7px; border: 1px solid var(--rule); background: #FFFFFF; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.chron { display: grid; gap: 4px; font-size: 14px; max-height: 220px; overflow-y: auto; }
.chron div { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 6px; }
.chron i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.credit { font-family: var(--mono); font-size: 12px; color: var(--muted); }
/* the explainer's longer parts fold away, so the chronicle stays a short scroll down */
.sheet details { border: 1px solid var(--rule); border-radius: 14px; background: #FFFFFF; padding: 0 12px; }
.sheet details[open] { padding-bottom: 12px; }
.sheet summary { list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 15px; }
.sheet summary::-webkit-details-marker { display: none; }
.sheet summary::after { content: ''; flex: none; width: 7px; height: 7px; margin-right: 4px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-2px) rotate(45deg); }
.sheet details[open] summary::after { transform: translateY(2px) rotate(-135deg); }
.sheet details ul { gap: 6px; }
/* a setting is one tappable row: words on the left, a switch on the right */
.setting { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; border: 1.5px solid var(--rule); background: #FFFFFF; border-radius: 16px; padding: 10px 12px; cursor: pointer; }
.setting b { display: block; font-size: 15px; font-weight: 600; }
.setting .note { display: block; line-height: 1.3; }
.switch { flex: none; position: relative; width: 50px; height: 30px; box-sizing: border-box; border-radius: 999px; border: 1px solid var(--rule); background: var(--well); transition: background .2s, border-color .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(30, 43, 47, .25); transition: transform .2s; }
.setting[aria-checked="true"] .switch { background: var(--fit); border-color: var(--fit); }
.setting[aria-checked="true"] .switch::after { transform: translateX(20px); }
@media (prefers-reduced-motion: reduce) { .gift-chip, .toast, .sheet { animation: none; } .slot, .switch, .switch::after { transition: none; } }
</style>

<div id="app">
  <canvas id="board" aria-label="The board. Tap a spot to try the selected tile there; drag to move, pinch to zoom."></canvas>

  <div class="hud" id="hud">
    <div class="brand">
      <div class="wordmark">numogarden</div>
      <div class="stats">
        <span>★ <b id="stars">0</b></span>
        <span class="meter" title="Gift meter"><i id="meter"></i></span>
        <span class="pips" id="pips" title="Weirdness"><span></span><span></span><span></span><span></span></span>
      </div>
    </div>
    <div class="hud-right">
      <button type="button" class="gift-chip" id="giftChip" hidden>Gift ready</button>
      <button type="button" class="icon" id="centerBtn" aria-label="Center the map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
      <button type="button" class="icon" id="infoBtn" aria-label="How it works, chronicle and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6"/><path d="M12 17.2v.1"/></svg>
      </button>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="tray" id="tray">
    <div class="hint" id="hint">Tap a glowing spot to try the tile there.</div>
    <div class="dock">
      <div class="slots" id="slots"></div>
      <div class="tools">
        <button type="button" class="btn" id="undoBtn" aria-label="Undo the last move">Undo</button>
        <button type="button" class="btn" id="rotBtn" aria-label="Turn the tile">Turn</button>
        <button type="button" class="btn primary" id="placeBtn">Place</button>
        <button type="button" class="btn" id="buildBtn" hidden aria-label="Builder: clear a tile">Build <span class="n" id="buildN">0</span></button>
        <button type="button" class="btn" id="ferryBtn" hidden>Ferry <span class="n" id="ferryN">0</span></button>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
</div>

<script>/*@@SIM@@*/</script>
<script>
(function () {
'use strict';
const S = window.Sim;
const LORE = /*@@LORE@@*/[];
const SQ3 = Math.sqrt(3);
const CORN = [0, 1, 2, 3, 4, 5].map(i => [Math.cos(Math.PI / 3 * i), Math.sin(Math.PI / 3 * i)]);
const EDGE = [0, 1, 2, 3, 4, 5].map(i => [Math.cos(Math.PI / 6 + Math.PI / 3 * i) * SQ3 / 2, Math.sin(Math.PI / 6 + Math.PI / 3 * i) * SQ3 / 2]);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// hamlets a light cream and fields a deeper wheat gold, so a town and the field that feeds it read apart, at night too
const COL = { H: '#F2D9BE', F: '#D6B03A', J: '#4E9B6A', S: '#7DC3D9', D: '#4A5470', M: '#C4DCAA', X: '#F2D3E6' };
const REGION_COL = { tc: '#9A7A00', warp: '#6E4FD0', plex: '#C23B5A' };
const REGION_NAME = { tc: 'Time-Circuit', warp: 'Warp', plex: 'Plex' };
const TERRAIN = { H: 'Hamlet', F: 'Field', J: 'Jungle', S: 'Sea', D: 'Data centre', M: 'Meadow', X: 'Plex' };
const TIER_H = ['hamlet', 'village', 'town', 'city', 'metropolis'];
const CLASS_NAME = { chrono: 'Chronodemon', amphi: 'Amphidemon', xeno: 'Xenodemon' };
const CURRENT_TXT = {
  Plex: `Every ${S.CFG.PLEX_EVERY} placements one wedge near it turns wild, while wild land is scarce.`,
  Surge: 'Towns that touch it build faster and wake up sooner.',
  Hold: 'The tiles around the pair stay as they are. Nothing decays or changes there.',
  Warp: 'Time runs twice as fast near it, for decay and for building.',
  Sink: 'It wears down one hamlet or field wedge near it every placement.'
};
const ROOFS = ['#E0705A', '#5E8FB0', '#D9A13B', '#C9607A'];
const STORE = 'numogarden-v1';
/* settings belong to the device, not the world, so they live apart from the save and survive New world */
const PREFS = 'numogarden-prefs';
const prefs = { cleanFits: false };
try { const p = JSON.parse(localStorage.getItem(PREFS) || 'null'); if (p && typeof p.cleanFits === 'boolean') prefs.cleanFits = p.cleanFits; } catch (e) { /* storage may be unavailable */ }
function savePrefs() { try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch (e) { /* storage may be unavailable */ } }

const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d');
const slotsEl = $('slots'), hintEl = $('hint'), toastsEl = $('toasts'), scrim = $('scrim'), sheet = $('sheet');

let state = null, view = { info: {}, labels: [], seas: [] }, idMap = {}, currents = [], tint = {};
let cam = { x: 0, y: 0, s: 46 };
let W = 0, H = 0, dpr = 1;
const ui = { sel: { from: 'offer', i: 0 }, ghost: null, mode: 'place', clearKey: null, valid: [], undo: [], floaters: [], pointerW: [0, 0], dirty: true, last: 0, cy: 0, sheetAt: 0, focus: null };

/* ---------- geometry ---------- */
function hexCenter(q, r) { return [1.5 * q, SQ3 * (r + q / 2)]; }
function cubeRound(q, r) {
  const x = q, z = r, y = -x - z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
  return [rx, rz];
}
function pixelToHex(wx, wy) { return cubeRound(2 / 3 * wx, -1 / 3 * wx + SQ3 / 3 * wy); }
function toScreen(wx, wy) { return [(wx - cam.x) * cam.s + W / 2, (wy - cam.y) * cam.s + ui.cy]; }
function toWorld(sx, sy) { return [(sx - W / 2) / cam.s + cam.x, (sy - ui.cy) / cam.s + cam.y]; }
function hh(a, b) { let x = Math.imul(a | 0, 73856093) ^ Math.imul((b | 0) + 1, 19349663); x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function wpt(i, u, v) { const A = CORN[i], B = CORN[(i + 1) % 6]; return [A[0] * u + B[0] * v, A[1] * u + B[1] * v]; }
function zoneOfW(w) { return w[0] === 'X' ? 0 : S.dr(S.aqOf(w.join(''))); }

/* ---------- state plumbing ---------- */
function selectedTile() {
  const slots = S.slotTiles(state);
  return slots.find(s => s.from === ui.sel.from && s.i === ui.sel.i) || slots[0];
}
function bestRot(st, q, r, prefer) {
  let best = null;
  const rots = st.kind === 'x' ? 1 : 6;
  for (let k = 0; k < rots; k++) {
    const e = S.evalPlacement(state, S.rot(st.w, k), q, r);
    if (!best || e.m > best.m || (e.m === best.m && k === prefer)) best = { k, m: e.m, n: e.n };
  }
  return best;
}
function computeValid() {
  ui.valid = [];
  if (ui.mode === 'builder') return;
  const cells = ui.mode === 'ferry' ? S.ferryCells(state, 3) : S.frontier(state);
  const st = selectedTile();
  for (const [q, r] of cells) { const b = bestRot(st, q, r); ui.valid.push({ q, r, m: b.m, n: b.n }); }
}
function refresh() {
  idMap = {};
  for (const k in state.map) idMap[state.map[k].id] = state.map[k];
  view = S.view(state);
  ui.focus = null; // the land has changed, so a tapped town's highlight is stale
  // currents as the rules see them, with the tiles at each end and a light tint over each area
  currents = []; tint = {};
  for (const c of S.activeCurrents(state)) {
    const a = idMap[c.a], b = idMap[c.b]; if (!a || !b) continue;
    const col = REGION_COL[S.region(c.hi - c.lo)], area = S.currentArea(state, c);
    currents.push({ c, a, b, col, area: new Set(area.map(t => t.id)) });
    for (const t of area) (tint[t.id] || (tint[t.id] = new Set())).add(col);
  }
  if (ui.ghost && state.map[S.key(ui.ghost.q, ui.ghost.r)]) ui.ghost = null;
  if (ui.mode === 'ferry' && state.ferries <= 0) ui.mode = 'place';
  if (ui.mode === 'builder' && state.builders <= 0) { ui.mode = 'place'; ui.clearKey = null; }
  computeValid();
  renderTray(); renderHud(); updateTools(); updateHint();
  ui.dirty = true;
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ state, cam })); } catch (e) { /* storage may be unavailable */ }
}
function pushUndo() { ui.undo.push(JSON.stringify(state)); if (ui.undo.length > 30) ui.undo.shift(); }

function greedyStep() {
  const slots = S.slotTiles(state).filter(s => s.from === 'offer');
  let best = null;
  for (const s of slots) for (const [q, r] of S.frontier(state)) for (let k = 0; k < 6; k++) {
    const e = S.evalPlacement(state, S.rot(s.w, k), q, r);
    const sc = e.m * 10 + e.n;
    if (!best || sc > best.sc) best = { sc, s, q, r, k };
  }
  S.place(state, { from: best.s.from, i: best.s.i }, best.q, best.r, best.k);
}
function newWorld() {
  const seed = (Math.random() * 4294967296) >>> 0;
  state = S.newGame(seed);
  for (let i = 0; i < 5; i++) greedyStep(); // the seed island
  state.events = [{ turn: state.turn, kind: 'start', txt: 'A small island to begin with. Everything after this is yours.' }];
  cam = { x: 0, y: 0, s: 46 };
  ui.undo = []; ui.ghost = null; ui.mode = 'place'; ui.sel = { from: 'offer', i: 0 };
  refresh(); fitView(false); save();
}

/* ---------- actions ---------- */
function selectSlot(s) {
  ui.sel = { from: s.from, i: s.i }; ui.focus = null; // back to placing: drop a tapped town's highlight
  if (ui.mode === 'builder') { ui.mode = 'place'; ui.clearKey = null; }

/* ---------- camera and input ---------- */
function resize() {
  const r = cv.getBoundingClientRect();

  ui.dirty = true;
}
function fitView(animate) {
  const ks = Object.values(state.map);
  if (!ks.length) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const tl of ks) { const c = hexCenter(tl.q, tl.r); x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); }
  const hud = $('hud').getBoundingClientRect(), tray = $('tray').getBoundingClientRect();

const pts = new Map(); let gest = null, camSaveT = 0;

    const [a, b] = [...pts.values()], m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    gest = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: cam.s, world: toWorld(m.x, m.y) };

cv.addEventListener('pointermove', e => {

});
function endPointer(e) {

cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {

document.addEventListener('gesturestart', e => e.preventDefault());
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function hitLemur(wx, wy) {
  const t = performance.now() / 1000;
  let best = null, bd = 0.3;
  for (const l of state.lemurs) { const [x, y] = lemurPos(l, t); const d = Math.hypot(x - wx, y - wy); if (d < bd) { bd = d; best = l; } }
  return best;
}
function onTap(sx, sy) {

  const lm = hitLemur(wx, wy);

  if (ui.valid.some(c => c.q === q && c.r === r)) {
    ui.ghost = { q, r, k: bestRot(selectedTile(), q, r, ui.ghost ? ui.ghost.k : -1).k };
    updateTools(); updateHint(); ui.dirty = true; return;

    openInspector(tile, wi); return;
  }

}

$('placeBtn').addEventListener('click', doPlace);
$('rotBtn').addEventListener('click', rotateGhost);
$('undoBtn').addEventListener('click', doUndo);
$('buildBtn').addEventListener('click', () => toggleMode('builder'));

$('giftChip').addEventListener('click', openGift);
document.addEventListener('keydown', e => {
  if (!scrim.hidden) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === 'r' || e.key === 'R') rotateGhost();
  else if (e.key === 'Enter') doPlace();
  else if (e.key === 'z' || e.key === 'Z') doUndo();
});
window.addEventListener('resize', () => { resize(); });

/* ---------- boot ---------- */
function start(data) {
  let loaded = null;
  try { if (data && data.state) loaded = { state: JSON.parse(data.state), cam: data.cam }; } catch (e) { loaded = null; }
  if (!loaded) { try { const raw = localStorage.getItem(STORE); if (raw) loaded = JSON.parse(raw); } catch (e) { loaded = null; } }
  resize();
  if (loaded && loaded.state && loaded.state.v === 1 && loaded.state.map && loaded.state.offers) {
